name: iOS Build
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '14.3'
      - name: Build iOS App
        run: xcodebuild -project ios/Play2Emu.xcodeproj -scheme Play2Emu -sdk iphoneos -configuration Release build
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/Release-iphoneos/
